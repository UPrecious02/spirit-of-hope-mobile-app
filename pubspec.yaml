name: spirit_of_hope
description: "Spirit of Hope Home Health Care companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  dio: 5.11.1
  shared_preferences: 2.5.6
  flutter_widget_from_html: 0.17.4
  cached_network_image: 4.0.4
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Variable fonts bundled from Google Fonts (OFL — licences alongside).
  # Weights are applied via FontVariation in lib/core/theme/typography.dart.
  fonts:
    - family: InterTight
      fonts:
        - asset: assets/fonts/inter_tight/InterTight-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist_mono/GeistMono-Variable.ttf
